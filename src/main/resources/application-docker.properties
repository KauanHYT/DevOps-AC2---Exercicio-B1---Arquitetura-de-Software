spring.datasource.url=jdbc:postgresql://postgres:5432/ac1final
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# B1 / ADR-003 - servico de IA dentro da rede do Docker Compose
ia.url=http://ia-service:8000

# B1 / ADR-004 - RabbitMQ e servico de notificacao na rede do Docker Compose
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.connection-timeout=2s
outbox.relay.habilitado=true
notificacao.url=http://notificacao-service:8001