spring.application.name=ac1final

# B1 / ADR-003 - servico de IA (Python/FastAPI)
ia.url=http://localhost:8000
ia.timeout.conexao-ms=300
ia.timeout.recomendacao-ms=800
ia.timeout.assistente-ms=5000

# B1 / ADR-004 - notificacao da promocao para PREMIUM (US 3)
# assincrono (padrao): evento no outbox -> RabbitMQ -> notificacao-service
# sincrono: chamada HTTP direta (alternativa A, so para o mini-lab comparar)
notificacao.modo=assincrono
notificacao.url=http://localhost:8001
notificacao.timeout-ms=2000
# o relay so liga onde existe broker (perfil docker); sem ele, os eventos ficam no outbox
outbox.relay.habilitado=false
outbox.relay.intervalo-ms=2000


# B1 / Desafio 6 - observabilidade: o Prometheus le /actuator/prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# o RabbitMQ fora NAO deixa o Core "DOWN": com o outbox, o Core funciona sem o broker (ADR-004)
management.health.rabbit.enabled=false