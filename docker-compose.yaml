services:

  postgres:
    image: postgres:17
    container_name: ac1-postgres
    environment:
      POSTGRES_DB: ac1final
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ac1final"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: ac1-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # B1 / ADR-003: serviço de IA independente (Python/FastAPI).
  # O backend NÃO declara depends_on para ele: a IA fora do ar não pode impedir o Core de subir.
  ia-service:
    build:
      context: ./ia-service
    container_name: ac1-ia
    environment:
      ATRASO_MS: ${IA_ATRASO_MS:-0}
    ports:
      - "8000:8000"

  # B1 / ADR-004: broker de eventos. O backend também NÃO depende dele para subir:
  # com o broker fora, os eventos esperam no outbox (tabela outbox_eventos).
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ac1-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  # B1 / ADR-004: consumidor da promoção para PREMIUM (US 3). Reconecta sozinho ao broker.
  notificacao-service:
    build:
      context: ./notificacao-service
    container_name: ac1-notificacao
    environment:
      RABBITMQ_HOST: rabbitmq
      CORE_URL: http://backend:8080
    ports:
      - "8001:8001"

  # B1 / ADR-005: broker MQTT dos dispositivos dos laboratórios.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ac1-mosquitto
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  # B1 / ADR-005: traduz o MQTT dos dispositivos para o POST /iot/eventos do Core.
  # Sessão persistente: com o gateway fora, o broker guarda as mensagens.
  iot-gateway:
    build:
      context: ./iot-gateway
    container_name: ac1-iot-gateway
    environment:
      MQTT_HOST: mosquitto
      CORE_URL: http://backend:8080

  # B1 / ADR-005: simulador de dispositivo, só para o mini-lab (perfil "lab").
  #   docker compose run --rm iot-simulador --aluno 7 --conclusoes 1
  iot-simulador:
    build:
      context: ./iot-gateway
    profiles: ["lab"]
    entrypoint: ["python", "-m", "app.simulador"]
    environment:
      MQTT_HOST: mosquitto

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ac1-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # assincrono (ADR-004) ou sincrono (alternativa A, só para o mini-lab)
      NOTIFICACAO_MODO: ${NOTIFICACAO_MODO:-assincrono}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # B1 / Desafio 6: observabilidade. O Prometheus coleta as métricas do Core e do RabbitMQ;
  # o Grafana mostra o dashboard versionado em observabilidade/grafana. Versões fixas (RPC).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ac1-prometheus
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: ac1-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # só para o laboratório: qualquer um vê os dashboards sem login (não edita)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/b1-arquitetura.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # B1 / Desafio 6 (ADR-006): a esteira. Perfil "ci": só sobe quando pedida pelo nome.
  # Usa o Docker da própria máquina (docker.sock) para construir e implantar as imagens
  # e lê o repositório local montado em /repo (só o que já foi commitado).
  jenkins:
    build:
      context: ./jenkins
    container_name: ac1-jenkins
    profiles: ["ci"]
    user: root
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - maven_cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/repo:ro
    networks:
      - ci

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ac1-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  jenkins_home:
  maven_cache:

# rede da homologação: o Jenkins e os containers que ele implanta (ac1-*-homolog)
networks:
  ci:
    name: b1-ci