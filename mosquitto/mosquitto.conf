# B1 / Desafio 5 (ADR-005): broker MQTT dos dispositivos dos laboratórios.
listener 1883
# só no laboratório: sem usuário e senha (em produção, usuário por dispositivo + ACL por tópico + TLS)
allow_anonymous true
# guarda sessões e mensagens QoS 1 em disco: sobrevive a um restart do broker
persistence true
persistence_location /mosquitto/data/
# mensagens guardadas por cliente com sessão persistente (ex.: o iot-gateway fora do ar)
max_queued_messages 1000
log_dest stdout
